name: Build akróasys

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── macOS (Apple Silicon + Intel Universal) ──────────────────────
  macos:
    runs-on: macos-15   # Apple Silicon runner (macos-14 retired by GitHub, 2026-11-08)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: brew install cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # git-main stable-audio-tools pins python_requires '>=3.10,<3.11', so
          # the backend MUST build on Python 3.10. 3.11 makes `pip install
          # stable-audio-tools` fail before PyInstaller runs (verified: every
          # platform errored "requires a different Python: 3.11.x not in
          # '<3.11,>=3.10'"). 3.10 also matches the locally-validated dev env.
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r backend/requirements.txt

      # The author's own words must survive the wire. requests decodes a
      # charset-less `text/event-stream` as ISO-8859-1, which turned every dash
      # and apostrophe the model wrote into mojibake in the panel -- so this runs
      # both transports against a real charset-less SSE server and compares byte
      # for byte. Here, right after the install, because it is a property of the
      # RESOLVED requests version and a dependency bump is one of the ways it can
      # come back. Its C++ counterpart (tools/source_charset_gate.py) needs no
      # step: it is a pre-build target and runs inside every platform's build.
      - name: Gate the author API encoding
        run: python tools/author_api_encoding_gate.py

      - name: Bundle Python backend (PyInstaller)
        working-directory: backend
        run: pyinstaller pipe_inference.spec --noconfirm

      - name: Verify bundled binary starts
        working-directory: backend
        env:
          T5YNTH_ALLOW_NO_MODELS: "1"
        run: |
          # Smoke test: binary must start and produce output (not crash on import).
          # No 'timeout' on macOS — run in background with kill fallback.
          ./dist/pipe_inference/pipe_inference < /dev/null > /tmp/be_out.log 2>&1 &
          PID=$!
          for i in $(seq 30); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if grep -q "Ready\|devices\|No model" /tmp/be_out.log; then
            echo "Backend smoke test passed"
          else
            echo "::error::Backend binary failed to reach ready state"
            cat /tmp/be_out.log
            exit 1
          fi

      - name: Configure CMake
        # Build all four macOS formats — Standalone, VST3, AU and CLAP — so the
        # .pkg builder downstream can stage every component. The legacy
        # T5YNTH_MACOS_STANDALONE_ONLY=ON flag dates back to when the
        # installer only shipped the Standalone; v1.7.1-beta.2 onward
        # bundles VST3 + AU as well, and the CLAP joins them here. The CLAP
        # target fetches clap-juce-extensions at configure time, like the two
        # header-only FetchContent dependencies already do.
        env:
          T5YNTH_VERSION: ${{ github.ref_name }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      # The LRO IS Csound, so a bundle without a working Csound of its own is a
      # silent oscillator on every machine that has none installed — and on a
      # machine that HAS one, nothing else notices. Runs before the backend is
      # copied in, while the bundles still carry the signatures the build gave
      # them. See third_party/csound/README.md.
      - name: Verify Csound travels with the bundles
        run: |
          for B in Standalone/akroasys.app VST3/akroasys.vst3 AU/akroasys.component CLAP/akroasys.clap; do
            python3 tools/verify_csound_bundle.py "build/T5ynth_artefacts/Release/$B"
          done

      - name: Verify Standalone version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED=$(echo "${{ github.ref_name }}" | sed -E 's/^v//; s/-.*$//')
          ACTUAL=$(defaults read "$(pwd)/build/T5ynth_artefacts/Release/Standalone/akroasys.app/Contents/Info" CFBundleShortVersionString)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Standalone version mismatch: tag=$EXPECTED, binary=$ACTUAL"
            exit 1
          fi
          echo "Version match: $ACTUAL"

      - name: Assemble app bundle
        run: |
          APP=build/T5ynth_artefacts/Release/Standalone/akroasys.app
          # Copy bundled backend into app Resources
          mkdir -p "$APP/Contents/Resources/backend"
          cp -R backend/dist/pipe_inference/* "$APP/Contents/Resources/backend/"
          # Re-sign the entire bundle (adding backend invalidated the JUCE ad-hoc signature)
          codesign --force --deep --sign - "$APP"

      - name: Smoke-test app bundle
        run: |
          APP=build/T5ynth_artefacts/Release/Standalone/akroasys.app
          # Verify binary is executable
          test -x "$APP/Contents/MacOS/akroasys"
          # Verify backend is executable
          test -x "$APP/Contents/Resources/backend/pipe_inference"
          # Check dylib dependencies resolve
          otool -L "$APP/Contents/MacOS/akroasys"
          # Try to launch — kill after 5s, exit 0 if it stayed alive (success)
          "$APP/Contents/MacOS/akroasys" &
          APP_PID=$!
          sleep 5
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App launched successfully (PID $APP_PID)"
            kill "$APP_PID" || true
          else
            wait "$APP_PID" || EXIT_CODE=$?
            echo "App exited with code ${EXIT_CODE:-unknown} — check logs above"
            exit 1
          fi

      - name: Import Developer ID certificates
        env:
          APP_CERT_P12_BASE64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          APP_CERT_P12_PASSWORD: ${{ secrets.MACOS_APP_CERT_P12_PASSWORD }}
          PKG_CERT_P12_BASE64: ${{ secrets.MACOS_PKG_CERT_P12_BASE64 }}
          PKG_CERT_P12_PASSWORD: ${{ secrets.MACOS_PKG_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$APP_CERT_P12_BASE64" || -z "$APP_CERT_P12_PASSWORD" || -z "$PKG_CERT_P12_BASE64" || -z "$PKG_CERT_P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Developer ID signing secrets not fully configured; skipping certificate import."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/akroasys-signing.keychain-db"
          APP_CERT="$RUNNER_TEMP/developer-id-application.p12"
          PKG_CERT="$RUNNER_TEMP/developer-id-installer.p12"

          printf '%s' "$APP_CERT_P12_BASE64" | base64 --decode > "$APP_CERT"
          printf '%s' "$PKG_CERT_P12_BASE64" | base64 --decode > "$PKG_CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          security import "$APP_CERT" -k "$KEYCHAIN" -P "$APP_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security import "$PKG_CERT" -k "$KEYCHAIN" -P "$PKG_CERT_P12_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*\"\\(Developer ID Application:[^\"]*\\)\".*/\\1/p' | head -n 1)"
          PKG_IDENTITY="$(security find-identity -v -p basic "$KEYCHAIN" | sed -n 's/.*\"\\(Developer ID Installer:[^\"]*\\)\".*/\\1/p' | head -n 1)"

          test -n "$APP_IDENTITY"
          test -n "$PKG_IDENTITY"

          echo "MACOS_APP_SIGN_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_PKG_SIGN_IDENTITY=$PKG_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notary API key
        env:
          MACOS_NOTARY_API_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_API_PRIVATE_KEY }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER }}
        run: |
          if [[ -z "$MACOS_NOTARY_API_PRIVATE_KEY" || -z "$MACOS_NOTARY_API_KEY_ID" || -z "$MACOS_NOTARY_API_ISSUER" ]]; then
            echo "Notary API secrets not fully configured; skipping API key preparation."
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          printf '%s' "$MACOS_NOTARY_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "MACOS_NOTARY_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # The .pkg now bundles Standalone + VST3 + AU + CLAP, all signed with the
      # same Developer ID Application identity. Plugins piggy-back on the
      # Standalone for the Python inference backend.
      - name: Prepare macOS release staging
        run: |
          mkdir -p archives

      - name: Build macOS installer (.pkg)
        env:
          MACOS_APP_SIGN_IDENTITY: ${{ env.MACOS_APP_SIGN_IDENTITY }}
          MACOS_PKG_SIGN_IDENTITY: ${{ env.MACOS_PKG_SIGN_IDENTITY }}
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_API_KEY_PATH: ${{ env.MACOS_NOTARY_API_KEY_PATH }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER }}
        run: |
          chmod +x installer/macos/build_pkg.sh
          installer/macos/build_pkg.sh \
            --app   build/T5ynth_artefacts/Release/Standalone/akroasys.app \
            --vst3  build/T5ynth_artefacts/Release/VST3/akroasys.vst3 \
            --au    build/T5ynth_artefacts/Release/AU/akroasys.component \
            --clap  build/T5ynth_artefacts/Release/CLAP/akroasys.clap \
            --version "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-alpha.0' }}" \
            --output archives/akroasys-macOS-Installer.pkg

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-macOS-Installer
          path: archives/akroasys-macOS-Installer.pkg

  # ── Windows ─────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # git-main stable-audio-tools pins python_requires '>=3.10,<3.11', so
          # the backend MUST build on Python 3.10. 3.11 makes `pip install
          # stable-audio-tools` fail before PyInstaller runs (verified: every
          # platform errored "requires a different Python: 3.11.x not in
          # '<3.11,>=3.10'"). 3.10 also matches the locally-validated dev env.
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu128
          pip install -r backend/requirements.txt

      - name: Bundle Python backend (PyInstaller)
        working-directory: backend
        run: pyinstaller pipe_inference.spec --noconfirm

      - name: Verify bundled backend starts
        shell: powershell
        working-directory: backend
        env:
          T5YNTH_ALLOW_NO_MODELS: "1"
        run: |
          # The redirect handles outlive the process that exits. PyInstaller's
          # onedir bootloader spawns a child that inherits them, so $proc can
          # report HasExited while the log file is still open -- complete, but
          # locked. Reading it then throws "used by another process", which this
          # step used to let stand as a backend failure: it failed the
          # v3.0.0-beta.2 tag run on a commit whose Windows job had passed on
          # main four minutes earlier. Retry until the handle is released.
          #
          # Bytes, not Get-Content -Raw, for stderr too: -Raw decodes with the
          # console's ANSI code page, so a non-ASCII backend message arrives
          # here as mojibake and the Contains() checks below read it wrong.
          #
          # The leading comma on every return is load-bearing, not a typo: a
          # function returning an array unrolls it into the output stream, so
          # the caller would get an Object[] -- and an EMPTY one would arrive as
          # $null, on which GetString() throws. ,$x wraps it so only the wrapper
          # unrolls and the byte[] survives typed.
          function Read-LogBytes([string]$path) {
            if (-not (Test-Path $path)) { return ,[byte[]]@() }
            for ($i = 0; $i -lt 40; $i++) {
              try { return ,[System.IO.File]::ReadAllBytes($path) }
              catch { Start-Sleep -Milliseconds 250 }
            }
            Write-Host "::warning::$path stayed locked for 10s -- reading it as empty"
            return ,[byte[]]@()
          }
          $backendExe = (Resolve-Path ".\dist\pipe_inference\pipe_inference.exe").Path
          $stdoutLog = Join-Path $env:RUNNER_TEMP "akroasys_backend_stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "akroasys_backend_stderr.log"
          $proc = Start-Process $backendExe `
            -WorkingDirectory (Get-Location).Path `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            $stdoutBytes = Read-LogBytes $stdoutLog
            $stderrBytes = Read-LogBytes $stderrLog
            $stdoutText = [System.Text.Encoding]::UTF8.GetString($stdoutBytes)
            $stderrText = [System.Text.Encoding]::UTF8.GetString($stderrBytes)
            $sentReadyFrame = $stdoutBytes.Length -gt 0 -and $stdoutBytes[0] -eq 2 -and $stdoutText.Contains('"devices"')
            $smokeTestNotice = $stderrText.Contains("smoke-test mode")
            if ($sentReadyFrame -and $smokeTestNotice) {
              Write-Host "Bundled backend emitted ready frame and exited after smoke-test startup."
              exit 0
            }
            Write-Host "::error::Bundled backend exited early with code $($proc.ExitCode)"
            if ($stdoutText) { Write-Host $stdoutText }
            if ($stderrText) { Write-Host $stderrText }
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Configure CMake
        env:
          T5YNTH_VERSION: ${{ github.ref_name }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      # Same reason as on macOS, plus the failure only Windows has: a module that
      # imports csound64.dll normally instead of delay-loading it resolves against
      # the HOST process's directory, so the standalone works and the VST3 does
      # not load in most DAWs. The check reads that out of the PE itself.
      - name: Verify Csound travels with the build
        shell: bash
        run: |
          python tools/verify_csound_bundle.py "build/T5ynth_artefacts/Release/Standalone"
          python tools/verify_csound_bundle.py "build/T5ynth_artefacts/Release/VST3/akroasys.vst3/Contents/x86_64-win"

      - name: Verify VST3 version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}" -replace '^v','' -replace '-.*$',''
          $infoPath = ".\build\T5ynth_artefacts\Release\VST3\akroasys.vst3\Contents\Resources\moduleinfo.json"
          $content = Get-Content $infoPath -Raw
          $pattern = '"Version":\s*"' + [regex]::Escape($expected) + '"'
          if ($content -notmatch $pattern) {
            Write-Host "::error::VST3 version mismatch. Expected '$expected'. moduleinfo.json:"
            Write-Host $content
            exit 1
          }
          Write-Host "Version match: $expected"

      - name: Assemble distribution
        shell: bash
        run: |
          mkdir -p dist/akroasys
          cp -R build/T5ynth_artefacts/Release/Standalone/* dist/akroasys/
          mkdir -p dist/akroasys/backend
          cp -R backend/dist/pipe_inference/* dist/akroasys/backend/
          cp LICENSE.txt THIRD_PARTY_LICENSES.txt dist/akroasys/

      - name: Smoke-test Windows standalone
        shell: powershell
        env:
          T5YNTH_ALLOW_NO_MODELS: "1"
        run: |
          $env:T5YNTH_REQUIRE_BUNDLED_BACKEND = "1"
          $appExe = (Resolve-Path ".\dist\akroasys\akroasys.exe").Path
          $proc = Start-Process $appExe `
            -WorkingDirectory (Split-Path -Parent $appExe) `
            -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Host "::error::Standalone app exited early with code $($proc.ExitCode)"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Create archives
        shell: bash
        run: |
          mkdir -p archives
          export XZ_OPT="-T0 -1"
          cp LICENSE.txt THIRD_PARTY_LICENSES.txt build/T5ynth_artefacts/Release/VST3/
          tar -cJf archives/akroasys-Windows-Standalone.tar.xz -C dist akroasys
          tar -cJf archives/akroasys-Windows-VST3.tar.xz \
            -C build/T5ynth_artefacts/Release/VST3 .
          ls -lh archives/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Windows-Standalone
          path: archives/akroasys-Windows-Standalone.tar.xz

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Windows-VST3
          path: archives/akroasys-Windows-VST3.tar.xz

      - name: Ensure Inno Setup is available
        shell: powershell
        run: |
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\iscc.exe"
          if (Test-Path $isccPath) {
            Write-Host "Using preinstalled Inno Setup at $isccPath"
            exit 0
          }
          choco install innosetup -y
          if (-not (Test-Path $isccPath)) {
            Write-Host "::error::Inno Setup was not found after installation"
            exit 1
          }

      - name: Build Windows installer (Inno Setup)
        shell: powershell
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $VERSION) { $VERSION = "0.0.0-dev" }
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\iscc.exe"
          & $isccPath /DAppVersion="$VERSION" `
               /DStandaloneDir="..\..\dist\akroasys" `
               /DVST3Dir="..\..\build\T5ynth_artefacts\Release\VST3" `
               /O"archives" `
               installer\windows\t5ynth.iss

      - name: Verify Windows installer release asset size
        shell: powershell
        run: |
          $installerParts = Get-ChildItem "archives\akroasys-Windows-Setup*"
          if (-not $installerParts) {
            Write-Host "::error::Windows installer output was not found."
            exit 1
          }
          $releaseAssetLimit = [int64]2147483648
          foreach ($part in $installerParts) {
            Write-Host "Windows installer part $($part.Name): $($part.Length) bytes"
            if ($part.Length -ge $releaseAssetLimit) {
              Write-Host "::error::Windows installer part $($part.Name) is too large for GitHub Releases. Size must be less than $releaseAssetLimit bytes."
              exit 1
            }
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Windows-Installer
          path: archives/akroasys-Windows-Setup*

  # ── Linux Base Artifacts + Ubuntu DEB (Ubuntu x86_64) ──────────
  linux:
    name: Linux Base Artifacts + Ubuntu DEB (Ubuntu x86_64)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Expand swap space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential patchelf \
            libcsound64-dev \
            libasound2-dev libcurl4-openssl-dev libfreetype-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libxrender-dev libfontconfig1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # git-main stable-audio-tools pins python_requires '>=3.10,<3.11', so
          # the backend MUST build on Python 3.10. 3.11 makes `pip install
          # stable-audio-tools` fail before PyInstaller runs (verified: every
          # platform errored "requires a different Python: 3.11.x not in
          # '<3.11,>=3.10'"). 3.10 also matches the locally-validated dev env.
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu128
          pip install -r backend/requirements.txt

      - name: Bundle Python backend (PyInstaller)
        working-directory: backend
        run: pyinstaller pipe_inference.spec --noconfirm

      - name: Configure CMake
        env:
          T5YNTH_VERSION: ${{ github.ref_name }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      # Same reason as the other two platforms, and here the trap is sharpest: the
      # runner HAS Csound in /usr/lib (that is where the bundle comes from), so a
      # bundle that silently falls through to it looks identical to a good one.
      # The check reads /proc/self/maps back to prove which file was mapped.
      - name: Verify Csound travels with the build
        run: |
          python3 tools/verify_csound_bundle.py build/T5ynth_artefacts/Release/Standalone
          python3 tools/verify_csound_bundle.py \
            build/T5ynth_artefacts/Release/VST3/akroasys.vst3/Contents/x86_64-linux

      - name: Assemble base distribution
        run: |
          mkdir -p dist/akroasys
          # -R over the whole directory: since the Csound bundling step the
          # Standalone is a binary PLUS libs/ (with libs/Opcodes64) and
          # licenses/csound, and copying only the binary would ship a silent LRO.
          cp -R build/T5ynth_artefacts/Release/Standalone/. dist/akroasys/
          mkdir -p dist/akroasys/backend
          cp -R backend/dist/pipe_inference/* dist/akroasys/backend/
          cp LICENSE.txt THIRD_PARTY_LICENSES.txt dist/akroasys/

      - name: Verify Linux artifact architecture
        run: |
          test -x dist/akroasys/akroasys
          test -x dist/akroasys/backend/pipe_inference
          file dist/akroasys/akroasys | tee /tmp/akroasys-file.txt
          file dist/akroasys/backend/pipe_inference | tee /tmp/pipe-file.txt
          grep -Eq 'ELF 64-bit.*x86-64' /tmp/akroasys-file.txt
          grep -Eq 'ELF 64-bit.*x86-64' /tmp/pipe-file.txt

      - name: Create archives
        run: |
          mkdir -p archives
          export XZ_OPT="-T0 -1"
          cp LICENSE.txt THIRD_PARTY_LICENSES.txt build/T5ynth_artefacts/Release/VST3/
          tar -cJf archives/akroasys-Linux-Base-x86_64-Standalone.tar.xz -C dist akroasys
          tar -cJf archives/akroasys-Linux-Base-x86_64-VST3.tar.xz \
            -C build/T5ynth_artefacts/Release/VST3 .
          ls -lh archives/

      - name: Stage Ubuntu backend bundle
        run: |
          installer/linux/stage_backend_bundle.sh --bundle-id ubuntu24.04-x86_64-cuda

      - name: Build Ubuntu DEB
        run: |
          installer/linux/build_deb.sh --skip-build --build-dir build --bundle-id ubuntu24.04-x86_64-cuda

      - name: Verify Ubuntu DEB
        run: |
          DEB="$(find archives/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          file "$DEB"
          ar t "$DEB" | tee /tmp/akroasys-deb-members.txt
          grep -qx 'debian-binary' /tmp/akroasys-deb-members.txt
          grep -qx 'control.tar.gz' /tmp/akroasys-deb-members.txt
          grep -qx 'data.tar.xz' /tmp/akroasys-deb-members.txt

      - name: Upload Linux Base Standalone
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Linux-Base-x86_64-Standalone
          path: archives/akroasys-Linux-Base-x86_64-Standalone.tar.xz

      - name: Upload Linux Base VST3
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Linux-Base-x86_64-VST3
          path: archives/akroasys-Linux-Base-x86_64-VST3.tar.xz

      - name: Upload Ubuntu DEB
        uses: actions/upload-artifact@v4
        with:
          name: akroasys-Ubuntu-x86_64-DEB
          path: archives/deb/*.deb

  # ── Release (only on tags) ──────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Archives are pre-built on each platform to preserve Unix permissions
      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.pkg' -exec mv {} release/ \;
          find artifacts -name 'akroasys-Windows-Setup.exe' -exec mv {} release/ \;
          find artifacts -name 'akroasys-Windows-Setup-*.bin' -exec mv {} release/ \;
          ls -lh release/

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/release_notes_header.md release_notes.md
          PREVIOUS_RELEASE_TAG="$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')"
          NOTES_ARGS=(-f tag_name="${{ github.ref_name }}")
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            NOTES_ARGS+=(-f previous_tag_name="$PREVIOUS_RELEASE_TAG")
          fi
          gh api repos/${{ github.repository }}/releases/generate-notes \
            "${NOTES_ARGS[@]}" \
            --jq '.body' >> release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            release/*.pkg \
            release/akroasys-Windows-Setup* \
            --title "akróasys ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            $PRERELEASE
